<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>やみっこトラブルメーカー暗記ゲーム</title>
  <meta name="description" content="NOMALEND系テキストの暗記ゲーム。次の行を当てろ！" />
  <style>
    :root{
      --bg:#0b0b0f; --panel:#121218; --muted:#9aa3b2; --fg:#e8ecf1; --acc:#7aa2ff; --ok:#66d9a8; --bad:#ff6b88; --warn:#ffd166;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, Hiragino Kaku Gothic ProN, "BIZ UDPGothic", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0;}
    body{background:radial-gradient(1000px 600px at 80% -10%, #1a1a29 0%, #0b0b0f 60%, #0b0b0f 100%);color:var(--fg);font-family:var(--sans);overflow:hidden;}

    .wrap{max-width:960px;margin-inline:auto;padding:24px}
    header{display:flex;align-items:center;gap:16px;margin-bottom:12px}
    header h1{font-size:clamp(18px,4vw,28px);margin:0;font-weight:800;letter-spacing:0.01em}
    header .badge{font-size:12px;color:#0b0b0f;background:var(--warn);padding:2px 8px;border-radius:999px}

    .card{background:linear-gradient(180deg, #14141d 0%, #101019 100%);border:1px solid #1e2030;box-shadow:0 10px 30px rgb(0 0 0 / 40%);border-radius:16px;overflow:hidden}
    .card .head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #1e2030}
    .card .head .title{font-weight:700}
    .card .body{padding:20px}

    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .panel{background:var(--panel);border:1px solid #1e2030;border-radius:12px;padding:14px}

    .prompt{font-family:var(--mono);font-size:clamp(14px,2.5vw,18px);line-height:1.6;word-break:break-word}
    .muted{color:var(--muted)}
    .small{font-size:12px}

    input[type="text"]{width:100%;background:#0e0e14;color:var(--fg);border:1px solid #23263a;border-radius:10px;padding:12px 14px;font-size:16px;outline-color:var(--acc)}

    .btns{display:flex;flex-wrap:wrap;gap:8px}
    button{appearance:none;border:1px solid #2a2d42;background:#151522;color:var(--fg);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
    button:hover{background:#1a1a2a}
    .btn-acc{border-color:#3952b0;background:#1a2450}
    .btn-acc:hover{background:#213066}
    .btn-ok{border-color:#2a6b57;background:#0f2a22}
    .btn-bad{border-color:#6b2a3d;background:#2a0f15}

    .score{display:flex;gap:12px;flex-wrap:wrap}
    .chip{font-family:var(--mono);background:#0f0f18;border:1px solid #2a2d42;border-radius:999px;padding:6px 10px}

    .toast{position:fixed;inset:auto 16px 16px auto;background:#12121a;border:1px solid #2a2d42;border-radius:10px;padding:10px 12px;box-shadow:0 10px 20px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:.25s}
    .toast.show{opacity:1;transform:translateY(0)}

    .penalty{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,1);z-index:1000;}
    .penalty.show{display:grid;}
    .penalty img{width:100vw;height:100vh;object-fit:cover;}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>やみっこトラブルメーカー暗記ゲーム</h1>
      <span class="badge">NOMALEND - Memorize</span>
    </header>

    <div class="card">
      <div class="head">
        <div class="title">次の行を当てろ</div>
        <div class="score">
          <div class="chip" id="chipScore">score: 0</div>
          <div class="chip" id="chipStreak">streak: 0</div>
          <div class="chip" id="chipBest">best: 0</div>
        </div>
      </div>
      <div class="body">
        <div class="row">
          <div class="panel" style="flex:2">
            <div class="muted small">現在の行</div>
            <div id="current" class="prompt" style="margin-top:6px">（スタートを押してね）</div>
          </div>
          <div class="panel" style="flex:3">
            <div class="muted small">次の行（正解を入力）</div>
            <input id="answer" type="text" placeholder="ここに入力して Enter / 判定" autocomplete="off" />
            <div class="btns" style="margin-top:10px">
              <button id="btnCheck" class="btn-acc">判定</button>
              <button id="btnReveal" class="btn-ghost">答えを見る</button>
              <button id="btnSkip" class="btn-ghost">スキップ</button>
            </div>
          </div>
        </div>

        <div class="btns" style="margin-top:14px">
          <button id="btnStart" class="btn-ok">スタート</button>
          <button id="btnReset" class="btn-bad">リセット</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="penalty" class="penalty" aria-hidden="true">
    <img id="penaltyImg" alt="penalty" />
  </div>

  <script>
    const PENALTY_IMAGES = [
      "images/p1.png",
      "images/p2.png",
      "images/p3.png",
      "images/p4.png",
      "images/p5.png",
      "images/p6.png",
      "images/p7.png",
    ];

    const RAW_LINES = [
      "ウラン", "プルトニウム", "硝酸", "バッテリー", "アセトン", "マッチ", "ニトログリセリン", "プレガバリン", "君は生きてる。", "この世界が間違っている。", "拝啓75mg", "私は愛されている", "拝啓脳科学者", "死ね", "愛", "深い傷に至る不快", "思いは重い", "これは報い、愉快犯じゃない", "今日という日の再放送を", "明日も明後日も明明後日も", "数日後も、数週間後も、数ヵ月後も", "ずっと、ずっと、ずっと、", "永遠に、永遠に、永遠に、", "繰り返さないための", "目を覆う前髪と、", "中央にある鼻を含めた", "一人称視点のドキュメンタリー番組の", "最終回", "これから始まる新番組は、なんてタイトルにしたい？", "…なんだ、それ", "そのタイトルは大分子供じみていないか？", "NOMALEND「新番組」"
    ];

    const elCurrent=document.getElementById('current');
    const elAnswer=document.getElementById('answer');
    const chipScore=document.getElementById('chipScore');
    const chipStreak=document.getElementById('chipStreak');
    const chipBest=document.getElementById('chipBest');
    const toastEl=document.getElementById('toast');
    const penaltyEl=document.getElementById('penalty');
    const penaltyImg=document.getElementById('penaltyImg');

    let score=0,streak=0,best=Number(localStorage.getItem('yamiko-best')||0);
    let index=0;

    function showToast(text){
      toastEl.textContent=text;
      toastEl.classList.add('show');
      setTimeout(()=>toastEl.classList.remove('show'),1300);
    }

    function showPenaltyImage(){
      const imgSrc=PENALTY_IMAGES[Math.floor(Math.random()*PENALTY_IMAGES.length)];
      penaltyImg.src=imgSrc;
      penaltyEl.classList.add('show');
      setTimeout(()=>penaltyEl.classList.remove('show'),2000);
    }

    function updateChips(){
      chipScore.textContent=`score: ${score}`;
      chipStreak.textContent=`streak: ${streak}`;
      chipBest.textContent=`best: ${best}`;
    }

    function setCurrent(){
      elCurrent.textContent=RAW_LINES[index]||'最終回';
    }

    function check(){
      const answer=elAnswer.value.trim();
      const correct=RAW_LINES[index+1];
      if(answer===correct){
        showToast('✅ 君は生きてる。');
        score++;streak++;index++;updateChips();setCurrent();elAnswer.value='';
      }else{
        showToast('❌ これは報い、愉快犯じゃない。');
        streak=0;index++;setCurrent();elAnswer.value='';showPenaltyImage();
      }
      if(score>best){best=score;localStorage.setItem('yamiko-best',best);}
    }

    function startGame(){score=0;streak=0;index=0;updateChips();setCurrent();showToast('スタート');}
    function resetGame(){score=0;streak=0;index=0;updateChips();elCurrent.textContent='（スタートを押してね）';elAnswer.value='';showToast('リセット');}

    document.getElementById('btnStart').addEventListener('click',startGame);
    document.getElementById('btnReset').addEventListener('click',resetGame);
    document.getElementById('btnCheck').addEventListener('click',check);
    document.getElementById('btnReveal').addEventListener('click',()=>{showToast('👉 '+(RAW_LINES[index+1]||'最終回'));});
    document.getElementById('btnSkip').addEventListener('click',()=>{index++;setCurrent();showToast('スキップ');});
    elAnswer.addEventListener('keydown',e=>{if(e.key==='Enter')check();});

    updateChips();
  </script>
</body>
</html>
